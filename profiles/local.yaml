# Local development profile: `task run-local` (pitches to stdout) or
#   GH_TOKEN=$(gh auth token) go run . run --profile profiles/local.yaml --dry-run
apiVersion: homerun2.sthings.io/v1alpha1
kind: SchedulePitcherProfile
metadata:
  name: local
spec:
  defaults:
    schedule: "*/15 * * * *"
  checks:
    - id: my-github-token
      type: github-token-expiry
      tokenFrom:
        env: GH_TOKEN
    - id: github-com-tls
      type: tls-endpoint
      target: github.com
      chain: true
  reminders:
    - id: rotate-local-token
      title: Rotate the local GitHub token
      due: "2026-12-31"
    - id: weekly-cleanup
      title: Clean up dev4-vm caches
      recurrence: "0 9 * * 1"
      leadTimes: [1d]
