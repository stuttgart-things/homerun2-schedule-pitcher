apiVersion: homerun2.sthings.io/v1alpha1
kind: SchedulePitcherProfile
metadata:
  name: platform
spec:
  pitcher:
    addr: https://omni.platform.sthings-vsphere.labul.sva.de/pitch/grafana
    format: grafana
    caFile: /etc/ssl/vault-pki-ca/ca.crt
    auth:
      tokenFrom:
        secretKeyRef:
          name: omni-pitcher-labul-platform
          namespace: crossplane-system
          key: token
  # The password comes from REDIS_PASSWORD (Secret homerun2-schedule-pitcher-redis,
  # key password), like the other homerun2 services.
  redis:
    addr: redis-stack.homerun2.svc.cluster.local
    port: "6379"
  defaults:
    schedule: "0 */6 * * *"
    timezone: Europe/Berlin
    remind: "0 8 * * *"
    assignee: patrick.hermann
    tags: [expiry]
  checks:
    # The runner token lives on machinery. Reading it from platform needs the
    # multi-cluster secret access of MVP 2 (#1); until then this check only
    # works on an instance running on machinery.
    - id: github-runner-pat
      type: github-token-expiry
      description: Fine-grained PAT used by ARC runners
      tokenFrom:
        secretKeyRef:
          name: github-runner-token
          namespace: tekton-ci
          key: GITHUB_TOKEN
      url: https://github.com/settings/personal-access-tokens
      tags: [pat, runner]
    - id: omni-platform-tls
      type: tls-endpoint
      target: omni.platform.sthings-vsphere.labul.sva.de
      chain: true
